[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nodestro-runtime"
version = "0.2.0"
description = "Nodestro Runtime – the multi-agent workflow engine of Nodestro, built on Orkexa, usable without server or interface."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # The agent library, at the exact commit Nodestro was validated with (orkexa has no tags).
    "orkexa[all,pdf] @ git+https://github.com/peterkarlhuber/orkexa.git@0861c1b2b79209c388a5e996035e5676a96f6d75",
    "pydantic>=2.6,<3",
    # Builds the Python environments of tools with third-party libraries (see python_envs.py).
    "uv>=0.5",
    "packaging>=23",
    # The MCP client (ADR-0007): the official SDK with its own protocol version negotiation.
    "mcp>=2.3,<3",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The server profile: PostgreSQL, encryption of tenant secrets (server_settings.SecretBox) and the Axentra platform
# services (axentra_platform, off unless NODESTRO_AXENTRA=on). The desktop and Local Docker never install this extra:
# Axentra is not a base dependency, and without it the server profile works and switching it on is refused.
postgres = [
    "psycopg[binary,pool]>=3.2",
    "cryptography>=42",
    "axentra[oidc] @ git+https://github.com/peterkarlhuber/axentra.git@36f493e479509a4ada721a2ca108d73eeaa8cb8e",
]
dev = [
    "psycopg[binary,pool]>=3.2",
    "cryptography>=42",
    "axentra[oidc] @ git+https://github.com/peterkarlhuber/axentra.git@36f493e479509a4ada721a2ca108d73eeaa8cb8e",
    "mypy>=1.13",
    # PostgreSQL's own parser, for the static tenant-isolation check (tests/test_tenant_filters.py).
    "pglast>=7,<9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-runtime"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Office Open XML parts with their long namespace and relationship URIs.
"src/nodestro_runtime/office.py" = ["E501"]
# Whole SQL statements as allowlist keys (matched exactly, so they are not split).
"src/nodestro_runtime/tenant_sql_allowlist.py" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_runtime"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nodestro_runtime"]
mypy_path = "src"

[[tool.mypy.overrides]]
# boto3/botocore (Amazon Bedrock, through orkexa[bedrock]) ship no type information.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Axentra is optional (the postgres extra, server profile only): mypy also runs where it is not installed.
module = ["axentra", "axentra.*"]
ignore_missing_imports = true

