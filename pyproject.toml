[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nodestro-runtime"
version = "0.2.0"
description = "Nodestro Runtime – the multi-agent workflow engine of Nodestro, built on Orkexa, usable without server or interface."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # The agent library, at the exact commit Nodestro was validated with (orkexa has no tags).
    "orkexa[all,pdf,local,convert] @ git+https://github.com/peterkarlhuber/orkexa.git@028faa16a529ae66228138af3b71a01c6d3aa6fc",
    # Semantic knowledge search on SQLite (vector and hybrid modes); no wheel for Windows on ARM, where the knowledge
    # base stays on full-text search and reports its semantic index as unavailable.
    "sqlite-vec>=0.1.6; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "pydantic>=2.6,<3",
    # Builds the Python environments of tools with third-party libraries (see python_envs.py).
    "uv>=0.5",
    "packaging>=23",
    # The MCP client (ADR-0007): the official SDK with its own protocol version negotiation.
    "mcp>=2.3,<3",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The server profile: PostgreSQL, encryption of tenant secrets (server_settings.SecretBox) and the Axentra platform
# services (axentra_platform, off unless NODESTRO_AXENTRA=on). The desktop and Local Docker never install this extra:
# Axentra is not a base dependency, and without it the server profile works and switching it on is refused.
# Every Axentra requirement below names the same commit (MUP-ONA B0); move them together.
postgres = [
    "psycopg[binary,pool]>=3.2",
    "cryptography>=42",
    "axentra[oidc] @ git+https://github.com/peterkarlhuber/axentra.git@60d83b31b0bfbd357b88d9e30b2601dfcfa5256e",
]
dev = [
    "psycopg[binary,pool]>=3.2",
    "cryptography>=42",
    "axentra[oidc] @ git+https://github.com/peterkarlhuber/axentra.git@60d83b31b0bfbd357b88d9e30b2601dfcfa5256e",
    # Keeps the rule engine of the tenant SQL check free of Nodestro (lint-imports, contracts below).
    "import-linter>=2.1",
    "mypy>=1.13",
    # moto's S3 server, for the Axentra file storage's S3 backend (tests/test_axentra_storage.py); brings boto3.
    "moto[server]>=5",
    # PostgreSQL's own parser, for the static tenant-isolation check (tests/test_tenant_filters.py).
    "pglast>=7,<9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-runtime"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Office Open XML parts with their long namespace and relationship URIs.
"src/nodestro_runtime/office.py" = ["E501"]
# Whole SQL statements as allowlist keys (matched exactly, so they are not split).
"src/nodestro_runtime/tenant_sql_allowlist.py" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_runtime"]

[tool.importlinter]
root_package = "nodestro_runtime"
include_external_packages = true

[[tool.importlinter.contracts]]
# MUP-ONA B4: the rule engine is taken over unchanged into orkexa (orkexa.testing.sqlcheck, B5). It imports only
# pglast (late, by name) and the standard library. import-linter does not report an import of the package root
# (`import nodestro_runtime`); tests/test_sqlcheck_rules.py checks that every import is the standard library or pglast.
name = "The SQL rule engine imports nothing of Nodestro and no third-party package"
type = "forbidden"
source_modules = ["nodestro_runtime.sqlcheck_rules"]
forbidden_modules = [
    "nodestro_runtime.**",
    "orkexa",
    "axentra",
    "psycopg",
    "psycopg_pool",
    "pydantic",
    "mcp",
    "cryptography",
    "sqlite_vec",
    "packaging",
]

[[tool.importlinter.contracts]]
# MUP-ONA B4: the generic PostgreSQL part (ConnectionSource, statement catalog, executor, index, file store, memory) is
# taken over unchanged into orkexa (orkexa.backends.postgres, B5). It may import orkexa (it implements orkexa's
# interfaces), psycopg (late) and the standard library, but nothing of Nodestro except itself. As above, an import of
# the package root is not reported; tests/test_sql_catalog.py checks every import of the package.
name = "The generic PostgreSQL part imports nothing of Nodestro"
type = "forbidden"
source_modules = ["nodestro_runtime.pg_generic"]
forbidden_modules = ["nodestro_runtime.**", "axentra", "mcp", "cryptography", "sqlite_vec", "packaging", "pglast"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nodestro_runtime"]
mypy_path = "src"

[[tool.mypy.overrides]]
# boto3/botocore (Amazon Bedrock, through orkexa[bedrock]) ship no type information.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Axentra is optional (the postgres extra, server profile only): mypy also runs where it is not installed.
module = ["axentra", "axentra.*"]
ignore_missing_imports = true

