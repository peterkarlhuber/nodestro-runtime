[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nodestro-runtime"
version = "0.2.0"
description = "Nodestro Runtime – the multi-agent workflow engine of Nodestro, built on Orkexa, usable without server or interface."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # The agent library. Every orkexa requirement in this file names the same version range; the exact commit
    # Nodestro is validated with lives in the studio lock (nodestro-studio platform/internal-server.txt).
    # web: the egress guard and the web search and page reading of the built-in web tools (NAL-A2, web_tools.py).
    "orkexa[all,pdf,local,convert,web]>=0.2.0.dev0,<0.3",
    # Semantic knowledge search on SQLite (vector and hybrid modes); no wheel for Windows on ARM, where the knowledge
    # base stays on full-text search and reports its semantic index as unavailable.
    "sqlite-vec>=0.1.6; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "pydantic>=2.6,<3",
    # Builds the Python environments of tools with third-party libraries (see python_envs.py).
    "uv>=0.5",
    "packaging>=23",
    # The MCP client (ADR-0007): the official SDK with its own protocol version negotiation.
    "mcp>=2.3,<3",
    "tzdata>=2024.1; sys_platform == 'win32'",
    # Value-free database error messages (tabrion.errors, standard library only; TABRION MIG-NOD-3, doc 06 N-1). Every
    # Tabrion requirement in this file names the same minor range (VER-1, tests/test_tabrion_pin.py); the exact commit
    # lives in the studio locks (nodestro-studio platform/internal-server.txt and, from PIN-W2, platform/internal.txt).
    "tabrion>=0.2,<0.3",
]

[project.optional-dependencies]
# The server profile: PostgreSQL, encryption of tenant secrets (server_settings.SecretBox) and the Axentra platform
# services (axentra_platform, off unless NODESTRO_AXENTRA=on). The desktop and Local Docker never install this extra:
# Axentra is not a base dependency, and without it the server profile works and switching it on is refused.
# Every Axentra requirement below names the same version range (MUP-ONA B0); the exact commit lives in the studio lock.
postgres = [
    # Orkexa's PostgreSQL backends (orkexa.backends.postgres, MUP-ONA B6) under the knowledge base and memory.
    "orkexa[postgres]>=0.2.0.dev0,<0.3",
    "psycopg[binary,pool]>=3.2",
    "cryptography>=42",
    "axentra[oidc]>=0.1.0.dev0,<0.2",
    # Tabrion's PostgreSQL part (doc 06 N-1, N-2): imported only in server-profile modules, guarded like psycopg.
    "tabrion[postgres]>=0.2,<0.3",
]
# The DDGS metasearch provider of search connections (NAL-A2): free, without a key and without guarantees; opt-in,
# never a default and never offered on a server.
web-ddgs = ["orkexa[web-ddgs]>=0.2.0.dev0,<0.3"]
dev = [
    # orkexa[sqlcheck]: the rule engine of the static tenant-isolation check (orkexa.testing.sqlcheck with PostgreSQL's
    # own parser pglast; tests/test_tenant_filters.py, tests/test_sql_catalog.py).
    "orkexa[postgres,sqlcheck,web-ddgs]>=0.2.0.dev0,<0.3",
    "psycopg[binary,pool]>=3.2",
    "cryptography>=42",
    "axentra[oidc]>=0.1.0.dev0,<0.2",
    # The PostgreSQL test fixtures (tests/postgres_support.py, TABRION MIG-NOD-1). Every Tabrion requirement in this
    # file names the same minor range (VER-1, RC-8; tests/test_tabrion_pin.py); the exact commit, a final release, lives
    # in the studio lock (nodestro-studio platform/internal-server.txt).
    "tabrion[testing,postgres]>=0.2,<0.3",
    # Keeps the rule engine of the tenant SQL check free of Nodestro (lint-imports, contracts below).
    "import-linter>=2.1",
    "mypy>=1.13",
    # moto's S3 server, for the Axentra file storage's S3 backend (tests/test_axentra_storage.py); brings boto3.
    "moto[server]>=5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-runtime"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Office Open XML parts with their long namespace and relationship URIs.
"src/nodestro_runtime/office.py" = ["E501"]
# Whole SQL statements as allowlist keys (matched exactly, so they are not split).
"src/nodestro_runtime/tenant_sql_allowlist.py" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_runtime"]

[tool.importlinter]
root_package = "nodestro_runtime"
include_external_packages = true

[[tool.importlinter.contracts]]
# MUP-ONA B6: the tenant SQL check is a test-time tool (nodestro-api's tenant-sql job runs it on the api's source). It
# reads the migrations, the allowlist and the source it scans as files and uses orkexa's rule engine
# (orkexa.testing.sqlcheck, pglast late), so it imports no other Nodestro module and no driver. The rule engine itself
# and Orkexa's PostgreSQL backends keep their own contracts in orkexa (MUP-ONA B5).
name = "The tenant SQL check imports nothing of Nodestro"
type = "forbidden"
source_modules = ["nodestro_runtime.tenant_sql_check"]
forbidden_modules = [
    "nodestro_runtime.**",
    "axentra",
    "psycopg",
    "psycopg_pool",
    "pydantic",
    "mcp",
    "cryptography",
    "sqlite_vec",
    "packaging",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nodestro_runtime"]
mypy_path = "src"

[[tool.mypy.overrides]]
# boto3/botocore (Amazon Bedrock, through orkexa[bedrock]) ship no type information.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Axentra is optional (the postgres extra, server profile only): mypy also runs where it is not installed.
module = ["axentra", "axentra.*"]
ignore_missing_imports = true

