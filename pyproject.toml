[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nodestro-runtime"
version = "0.2.0"
description = "Nodestro Runtime – the multi-agent workflow engine of Nodestro, built on Orkexa, usable without server or interface."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Peter Karlhuber" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # The agent library, at the exact commit Nodestro was validated with (orkexa has no tags).
    "orkexa[all,pdf] @ git+https://github.com/peterkarlhuber/orkexa.git@3364fb8eadb0942cd35cf9e9678f15b0121cfbbb",
    "pydantic>=2.6,<3",
    # Builds the Python environments of tools with third-party libraries (see python_envs.py).
    "uv>=0.5",
    "packaging>=23",
    # The MCP client (ADR-0007): the official SDK with its own protocol version negotiation. It needs Python 3.11+;
    # on 3.10 MCP servers cannot be reached (mcp.unavailable), everything else works.
    "mcp>=2.3,<3; python_version >= '3.11'",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The server profile: PostgreSQL, encryption of tenant secrets (server_settings.SecretBox) and the Axentra platform
# services (axentra_platform, off unless NODESTRO_AXENTRA=on). Axentra needs Python 3.11+: on 3.10 the server
# profile works without it, and switching it on is refused. The desktop and Local Docker never install this extra.
postgres = [
    "psycopg[binary,pool]>=3.2",
    "cryptography>=42",
    "axentra[oidc] @ git+https://github.com/peterkarlhuber/axentra.git@024da57c15b064ea3abcf4119518707fbcc4e7b5 ; python_version >= '3.11'",
]
dev = [
    "psycopg[binary,pool]>=3.2",
    "cryptography>=42",
    "axentra[oidc] @ git+https://github.com/peterkarlhuber/axentra.git@024da57c15b064ea3abcf4119518707fbcc4e7b5 ; python_version >= '3.11'",
    "mypy>=1.13",
    # PostgreSQL's own parser, for the static tenant-isolation check (tests/test_tenant_filters.py).
    "pglast>=7,<9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-runtime"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Office Open XML parts with their long namespace and relationship URIs.
"src/nodestro_runtime/office.py" = ["E501"]
# Whole SQL statements as allowlist keys (matched exactly, so they are not split).
"src/nodestro_runtime/tenant_sql_allowlist.py" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_runtime"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nodestro_runtime"]
mypy_path = "src"

[[tool.mypy.overrides]]
# The MCP SDK needs Python 3.11+ (dependency with an environment marker); on 3.10 it is not installed.
module = ["mcp", "mcp.*", "mcp_types", "mcp_types.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# boto3/botocore (Amazon Bedrock, through orkexa[bedrock]) ship no type information.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Axentra (optional, server profile) needs Python 3.11+; mypy checks against 3.10, where it is not installed.
module = ["axentra", "axentra.*"]
ignore_missing_imports = true

