name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    # PostgreSQL storage (ADR-0002) runs the storage contract against a real server; a missing database fails.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nodestro-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NODESTRO_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=nodestro-ci dbname=postgres
      NODESTRO_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The Nodestro components and orkexa are private: pip clones them with a token that can read them.
      - name: Grant read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/".insteadOf "https://github.com/peterkarlhuber/"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  docker:
    # Tools with libraries in the Docker sandbox (ADR-0006 point 6): a real image is built from a hashed lock file and
    # a tool runs in it without network. A missing Docker fails this job instead of skipping the tests.
    runs-on: ubuntu-latest
    env:
      NODESTRO_DOCKER_TESTS: "1"
      NODESTRO_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # The Nodestro components and orkexa are private: pip clones them with a token that can read them.
      - name: Grant read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/".insteadOf "https://github.com/peterkarlhuber/"
      - run: pip install -e ".[dev]"
      - run: docker info
      - run: pytest tests/test_container_images.py

  builtin-sandbox:
    # Acceptance tests of the built-in sandbox prototype (ADR-0006 point 7, plan PR-13) on Linux x86-64. A sandbox
    # that cannot start fails this job instead of skipping the tests. The prototype stays non-isolating either way.
    runs-on: ubuntu-latest
    env:
      NODESTRO_REQUIRE_BWRAP: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # The Nodestro components and orkexa are private: pip clones them with a token that can read them.
      - name: Grant read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/".insteadOf "https://github.com/peterkarlhuber/"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor; the report records whether bwrap works
      # as installed. Only if it does not, the restriction is lifted for this runner (never on a user's machine).
      - name: Check that bwrap can create namespaces
        run: |
          bwrap --version
          if bwrap --unshare-all --ro-bind / / true; then
            echo "bwrap works as installed"
          else
            echo "::notice::bwrap cannot create user namespaces as installed; lifting the AppArmor restriction for this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            bwrap --unshare-all --ro-bind / / true
          fi
      - run: pip install -e ".[dev]"
      - run: pytest -s tests/test_builtin_sandbox.py
      - run: python -m nodestro_runtime.builtin_sandbox

  package:
    # The wheel installs on its own and contains what the package needs at run time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The Nodestro components and orkexa are private: pip clones them with a token that can read them.
      - name: Grant read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/".insteadOf "https://github.com/peterkarlhuber/"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -c "import nodestro_runtime as p; print(p.__name__, p.__version__)"
          # The PostgreSQL migrations are package data; the module imports without the optional driver.
          "$RUNNER_TEMP/wheel/bin/python" -c "from nodestro_runtime.storage_postgres import postgres_migrations as m; assert m(), 'no migrations in the wheel'; print(sorted(m()))"
      # The quickstart of the README, run with the installed wheel outside the checkout (no sources on the path).
      - name: Run the README quickstart with the installed wheel
        run: |
          python - > "$RUNNER_TEMP/quickstart.py" <<'EOF'
          import pathlib, re
          print(re.findall(r"```python\n(.*?)```", pathlib.Path("README.md").read_text(), re.DOTALL)[0])
          EOF
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" quickstart.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
