name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # CI-FAST AP1: p99 10.6 min, slowest entry 3.13 (successful runs 2026-11-01..07)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    # PostgreSQL storage (ADR-0002) runs the storage contract against a real server; a missing database fails.
    # The image is pinned by digest (MUP-ONA O8); the jobs pg-a and pg-b below run the PostgreSQL tests again, also
    # as the restricted runtime role and with pgvector.
    services:
      postgres:
        image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3 # postgres:17
        env:
          POSTGRES_PASSWORD: nodestro-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NODESTRO_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=nodestro-ci dbname=postgres
      NODESTRO_REQUIRE_POSTGRES: "1"
      # The mutation probe of the statement catalog (T-CAT-2, tests/test_sql_catalog.py) writes its outcome here.
      NODESTRO_CATALOG_REPORTS: reports/sql-catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Import contracts (pyproject.toml, [tool.importlinter]): the SQL rule engine stays free of Nodestro (MUP-ONA B4).
      - run: lint-imports
      # Every pytest step compares its skipped tests with an expectation file (MUP-ONA A0, scripts/check_skips.py):
      # a test that starts or stops being skipped fails the job until the file says why.
      - run: pytest --junitxml=junit-test.xml
      - name: Skipped tests as expected
        run: python scripts/check_skips.py junit-test.xml tests/ci/skipped-test.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sql-catalog-mutation-probe-${{ matrix.python }}
          path: reports/sql-catalog/
          if-no-files-found: error
      # Known vulnerabilities in the installed dependencies (as orkexa's CI checks them). Blocking: an advisory that
      # was reviewed and cannot be fixed yet goes into PIP_AUDIT_IGNORE (space-separated IDs, with the reason here).
      - name: Dependency audit
        if: matrix.python == '3.13'
        env:
          PIP_AUDIT_IGNORE: ""
        run: |
          pip install pip-audit==2.10.1
          args=(); for id in $PIP_AUDIT_IGNORE; do args+=(--ignore-vuln "$id"); done
          pip-audit --skip-editable --progress-spinner off "${args[@]}"


  # The PostgreSQL tests (every test file that uses tests/postgres_support.py or names a test server) on PostgreSQL
  # without pgvector (pg-a: the runtime ranks vectors) and with it (pg-b: pgvector ranks them), on every Python of the
  # matrix (MUP-ONA MP-B3). Each runs twice: as the superuser that migrates, then as a production server runs, with
  # the restricted runtime role (no DDL, no BYPASSRLS, owns nothing) for every database the tests open; the CI user
  # stays the owner that migrates (tests/postgres_support.py). Both images are pinned by digest (O8).
  pg-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # CI-FAST AP1: p99 11.5 min, all three entries alike (successful runs 2026-11-01..07)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    services:
      postgres:
        image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3 # postgres:17
        env:
          POSTGRES_PASSWORD: nodestro-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NODESTRO_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=nodestro-ci dbname=postgres
      NODESTRO_REQUIRE_POSTGRES: "1"
      NODESTRO_CONFORMANCE_REPORTS: reports/conformance
      NODESTRO_RANKING_REPORTS: reports/ranking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: PostgreSQL tests (superuser)
        run: pytest --junitxml=junit-pg-a.xml $(grep -l -E "postgres_support|NODESTRO_TEST_POSTGRES" tests/test_*.py)
      - name: Skipped tests as expected
        run: python scripts/check_skips.py junit-pg-a.xml tests/ci/skipped-pg-a.txt
      - name: PostgreSQL tests as the restricted runtime role (pg-a-restricted)
        env:
          NODESTRO_TEST_RUNTIME_ROLE: "1"
        run: >-
          pytest --junitxml=junit-pg-a-runtime-role.xml
          $(grep -l -E "postgres_support|NODESTRO_TEST_POSTGRES" tests/test_*.py)
      - name: Skipped tests as expected (restricted runtime role)
        run: python scripts/check_skips.py junit-pg-a-runtime-role.xml tests/ci/skipped-pg-a-runtime-role.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pg-a-reports-${{ matrix.python }}
          path: reports/
          if-no-files-found: ignore

  pg-b:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # CI-FAST AP1: p99 12.8 min, slowest entry 3.14 (successful runs 2026-11-01..07)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    services:
      postgres:
        image: pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8 # pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: nodestro-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NODESTRO_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=nodestro-ci dbname=postgres
      NODESTRO_TEST_PGVECTOR: host=127.0.0.1 port=5432 user=postgres password=nodestro-ci dbname=postgres
      NODESTRO_REQUIRE_POSTGRES: "1"
      # A test that needs pgvector fails here instead of skipping (MUP-ONA T-PG-2).
      NODESTRO_REQUIRE_PGVECTOR: "1"
      NODESTRO_CONFORMANCE_REPORTS: reports/conformance
      NODESTRO_RANKING_REPORTS: reports/ranking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: PostgreSQL tests with pgvector (superuser)
        run: pytest --junitxml=junit-pg-b.xml $(grep -l -E "postgres_support|NODESTRO_TEST_POSTGRES|NODESTRO_TEST_PGVECTOR" tests/test_*.py)
      - name: Skipped tests as expected
        run: python scripts/check_skips.py junit-pg-b.xml tests/ci/skipped-pg-b.txt
      - name: PostgreSQL tests with pgvector as the restricted runtime role (pg-b-restricted)
        env:
          NODESTRO_TEST_RUNTIME_ROLE: "1"
        run: >-
          pytest --junitxml=junit-pg-b-runtime-role.xml
          $(grep -l -E "postgres_support|NODESTRO_TEST_POSTGRES|NODESTRO_TEST_PGVECTOR" tests/test_*.py)
      - name: Skipped tests as expected (restricted runtime role)
        run: python scripts/check_skips.py junit-pg-b-runtime-role.xml tests/ci/skipped-pg-b-runtime-role.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pg-b-reports-${{ matrix.python }}
          path: reports/
          if-no-files-found: ignore

  tenant-sql-api:
    # The tenant SQL check (tenant_sql_check.py) of this commit scans nodestro-api's source (MUP-ONA A11): an early
    # warning that a rule change here would fail the API. nodestro-api is public, so it is checked out anonymously with
    # this workflow's read-only token and no secret; the full proof is nodestro-api's own job tenant-sql (with the
    # pinned and with the current runtime checker). A missing checkout fails the job (NODESTRO_REQUIRE_API_SCAN), and
    # no test of the check may be skipped (tests/ci/skipped-tenant-sql-api.txt is empty). If nodestro-api becomes
    # private, this job is removed by a PR with its reason; it never uses NODESTRO_READ.
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 1.2 min (successful runs 2026-11-01..07)
    permissions:
      contents: read
    env:
      NODESTRO_API_SRC: ${{ github.workspace }}/nodestro-api/src
      NODESTRO_REQUIRE_API_SCAN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out nodestro-api (public, read-only, no credentials kept)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peterkarlhuber/nodestro-api
          path: nodestro-api
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Checked API commit
        run: git -C nodestro-api rev-parse HEAD
      - name: Tenant SQL check of the API with this commit's checker
        run: pytest -v -m tenant_api_scan --junitxml=junit-tenant-sql-api.xml tests/test_tenant_filters.py
      - name: Skipped tests as expected (none)
        run: python scripts/check_skips.py junit-tenant-sql-api.xml tests/ci/skipped-tenant-sql-api.txt

  security-vectors-sync:
    # Axentra's copy of the shared security test vectors (tests/vectors/security-vectors.json, MUP-ONA A8) must be the
    # canonical file of this commit: axentra's tests/vectors/SOURCE.md records its version and SHA-256. Axentra has no
    # reference to Nodestro, so the comparison runs only here. axentra is public: it is checked out anonymously with
    # this workflow's read-only token and no secret. A missing checkout fails the job (NODESTRO_REQUIRE_VECTOR_SYNC),
    # and no test of the comparison may be skipped (tests/ci/skipped-security-vectors-sync.txt is empty). A change of
    # the corpus merges in axentra first (tests/vectors/README.md). It never uses NODESTRO_READ.
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 1.1 min (successful runs 2026-11-01..07)
    permissions:
      contents: read
    env:
      NODESTRO_AXENTRA_SRC: ${{ github.workspace }}/axentra
      NODESTRO_REQUIRE_VECTOR_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out axentra (public, read-only, no credentials kept)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peterkarlhuber/axentra
          ref: master
          path: axentra
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Checked axentra commit
        run: git -C axentra rev-parse HEAD
      - name: Axentra's copy equals the canonical security vectors
        run: pytest -v --junitxml=junit-security-vectors-sync.xml tests/test_security_vectors_sync.py
      - name: Skipped tests as expected (none)
        run: python scripts/check_skips.py junit-security-vectors-sync.xml tests/ci/skipped-security-vectors-sync.txt

  docker:
    # Tools with libraries and local MCP servers (WP-8) in the Docker sandbox (ADR-0006 point 6): a real image is built
    # from a hashed lock file and a tool or a stdio MCP server runs in it without network. A missing Docker fails this
    # job instead of skipping the tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 3.0 min (successful runs 2026-11-01..07)
    env:
      NODESTRO_DOCKER_TESTS: "1"
      NODESTRO_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - run: docker info
      - run: pytest --junitxml=junit-docker.xml tests/test_container_images.py tests/test_sandbox_gateway.py tests/test_mcp_stdio.py
      - name: Skipped tests as expected
        run: python scripts/check_skips.py junit-docker.xml tests/ci/skipped-docker.txt
      # The dependency-resolve path (RT-038) on this engine: the pinned resolver image from ghcr.io by digest, its
      # self-test with the resolve limits, the resolve container's effective limits, network and environment, timeout,
      # cancel and cleanup, and one pure-Python wheel resolved from PyPI. Under NODESTRO_REQUIRE_DOCKER an unproven
      # daemon fails these tests instead of skipping them.
      - name: Dependency resolve on the real engine
        run: pytest -v --junitxml=junit-docker-resolve.xml tests/test_resolve_real_engine.py
      - name: Skipped tests as expected (dependency resolve)
        run: python scripts/check_skips.py junit-docker-resolve.xml tests/ci/skipped-docker-resolve.txt

  builtin-sandbox:
    # Security probes and compatibility checks of the built-in Linux sandbox (Landlock + seccomp, ADR-0006) as the
    # runner's normal user, with the runner's AppArmor restrictions as shipped. A sandbox that cannot start fails this
    # job instead of skipping the tests. The real target systems (Ubuntu 24.04 and Debian 13 with their own kernels)
    # are tested with the packaged desktop in nodestro-desktop's "Sandbox systems" workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-FAST AP1: p99 2.3 min (successful runs 2026-11-01..07)
    env:
      NODESTRO_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Kernel features
        run: |
          id; uname -r; cat /sys/kernel/security/lsm; echo
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
      - run: pytest -s --junitxml=junit-builtin-sandbox.xml tests/test_builtin_sandbox.py tests/test_sandbox_policy.py
      - name: Skipped tests as expected
        run: python scripts/check_skips.py junit-builtin-sandbox.xml tests/ci/skipped-builtin-sandbox.txt
      - name: Python environment with a compiled library, installed offline from hash-pinned wheels
        run: |
          pip download --only-binary=:all: --no-deps --require-hashes -r tests/data/compiled-library.txt -d "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/pip" install --no-index --find-links "$RUNNER_TEMP/wheels" --require-hashes -r tests/data/compiled-library.txt
          "$RUNNER_TEMP/env/bin/pip" install pydantic typing-extensions
      - name: Security probes and compatibility checks
        run: python -m nodestro_runtime.sandbox_probes --env-python "$RUNNER_TEMP/env/bin/python"

  builtin-sandbox-arm64:
    # Linux on AArch64 (a real arm64 runner): the built-in sandbox's seccomp filter and probes use x86-64 system call
    # numbers, so it must report itself unavailable here and its confinement script must refuse before any code runs
    # (docs/sandbox-arm64.md). Untrusted code then needs Docker. The job fails if the sandbox ever becomes available
    # on this architecture without its own evidence.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15 # CI-FAST AP1: p99 2.0 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Kernel features
        run: |
          id; uname -m; uname -r; cat /sys/kernel/security/lsm; echo
          python -c "import platform, struct; print(platform.machine(), struct.calcsize('P') * 8, 'bit')"
          python -c "from nodestro_runtime.sandbox_confine import landlock_abi; print('landlock ABI', landlock_abi())"
      - name: The sandbox fails closed on AArch64
        run: >-
          pytest -v --junitxml=junit-builtin-sandbox-arm64.xml
          tests/test_sandbox_arch.py tests/test_builtin_sandbox.py tests/test_sandbox_policy.py
      - name: Skipped tests as expected
        run: python scripts/check_skips.py junit-builtin-sandbox-arm64.xml tests/ci/skipped-builtin-sandbox-arm64.txt
      - name: The probe command reports the sandbox unavailable (exit status 2, reason platform)
        run: |
          set +e
          python -I -m nodestro_runtime.sandbox_probes --json > "$RUNNER_TEMP/probes.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/probes.json"
          test "$code" = 2
          python -c "import json, sys; s = json.load(open(sys.argv[1]))['status']; assert not s['available'] and s['reason'] == 'platform', s" "$RUNNER_TEMP/probes.json"

  package:
    # The wheel installs on its own and contains what the package needs at run time.
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 0.9 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install build==1.6.1
      - run: python -m build
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
      - name: Check the installed wheel
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -c "import nodestro_runtime as p; print(p.__name__, p.__version__)"
          # The PostgreSQL migrations are package data; the module imports without the optional driver.
          "$RUNNER_TEMP/wheel/bin/python" -c "from nodestro_runtime.storage_postgres import postgres_migrations as m; assert m(), 'no migrations in the wheel'; print(sorted(m()))"
      # The quickstart of the README, run with the installed wheel outside the checkout (no sources on the path).
      - name: Run the README quickstart with the installed wheel
        run: |
          python - > "$RUNNER_TEMP/quickstart.py" <<'EOF'
          import pathlib, re
          print(re.findall(r"```python\n(.*?)```", pathlib.Path("README.md").read_text(), re.DOTALL)[0])
          EOF
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" quickstart.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
