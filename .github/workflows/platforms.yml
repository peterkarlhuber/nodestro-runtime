name: Platforms

# Nodestro Runtime must import and start on every operating system the desktop supports, also where the built-in
# Linux sandbox and Docker are missing (then only code that needs isolation is refused). This job runs the
# platform tests (tests/test_platform_start.py) on real macOS and Windows runners, on both CPU architectures, and the
# folder tools with their attack tests (tests/test_folders.py, N-10/N-63): links, junctions, hard links, swaps during
# a call, Unicode and case behave differently on each file system. The folder index (tests/test_folder_index.py, N-12)
# reads through the same guard.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: platforms-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  start:
    name: start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15 # CI-FAST AP1: p99 3.2 min, slowest entry macos-15-intel (successful runs 2026-11-01..07)
    strategy:
      fail-fast: false
      matrix:
        # macos-latest: Apple Silicon (arm64); macos-15-intel: x86-64; windows-11-arm: ARM64.
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # pyproject.toml declares version ranges for the internal packages; their exact commits live in the
      # studio lock (nodestro-studio platform/internal-server.txt), minus this package itself.
      - name: Studio lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}  # read-only; scripts/studio_lock.sh asks GitHub for lock lag
        run: |
          python -m pip install "pip>=26.1"
          bash scripts/studio_lock.sh "$RUNNER_TEMP/lock-all.txt" # paired studio lock on pull requests, lock lag on master pushes
          grep -v '^nodestro-runtime ' "$RUNNER_TEMP/lock-all.txt" > "$RUNNER_TEMP/lock.txt"
          cat "$RUNNER_TEMP/lock.txt"
      # The Nodestro components and orkexa are public: pip clones them anonymously over https.
      - name: Install
        run: |
          # Windows ARM64: cryptography (needed by google-auth through orkexa) published win_arm64 wheels last for
          # 46.0.3; newer versions would be compiled from source, which needs Rust and OpenSSL on the runner.
          if [ "$RUNNER_OS" = "Windows" ] && [ "$RUNNER_ARCH" = "ARM64" ]; then
            echo "cryptography==46.0.3" > "$RUNNER_TEMP/constraints.txt"
            export PIP_CONSTRAINT="$RUNNER_TEMP/constraints.txt"
          fi
          # Without the dev extra: psycopg-binary (the server profile) has no Windows ARM64 wheel, and the desktop
          # does not use PostgreSQL.
          pip install -c "$RUNNER_TEMP/lock.txt" -e . "pytest>=8" "pytest-asyncio>=0.24"
      - name: System
        run: python -c "import platform, sys; print(sys.platform, platform.machine(), platform.platform())"
      - name: Import the workspace (the path that failed on macOS)
        run: python -c "import nodestro_runtime.workspace as w; print('imported', w.__name__)"
      # N-22: the trust checks of Nodestro's own integration and the package file checks compare real paths, which
      # differ on Windows (short names, case) and macOS (/private).
      - run: >-
          pytest -v --junitxml=junit-platforms.xml tests/test_platform_start.py tests/test_folders.py
          tests/test_folder_index.py tests/test_trusted_integrations.py
          tests/test_extension_isolation.py::test_only_the_distributions_own_regular_files_are_read
          tests/test_extension_isolation.py::test_a_linked_package_folder_is_refused
      # MUP-ONA A0: the skipped tests of each system as listed in its expectation file (scripts/check_skips.py).
      - name: Skipped tests as expected
        run: python scripts/check_skips.py junit-platforms.xml "tests/ci/skipped-platforms-${{ matrix.os }}.txt"
