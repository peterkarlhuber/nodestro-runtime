name: Platforms

# Nodestro Runtime must import and start on every operating system the desktop supports, also where the built-in
# Linux sandbox and Docker are missing (then only code that needs isolation is refused). This job runs the
# platform tests (tests/test_platform_start.py) on real macOS and Windows runners, on both CPU architectures.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  start:
    name: start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest: Apple Silicon (arm64); macos-15-intel: x86-64; windows-11-arm: ARM64.
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # The Nodestro components and orkexa are public: pip clones them anonymously over https.
      - name: Install
        run: |
          # Windows ARM64: cryptography (needed by google-auth through orkexa) published win_arm64 wheels last for
          # 46.0.3; newer versions would be compiled from source, which needs Rust and OpenSSL on the runner.
          if [ "$RUNNER_OS" = "Windows" ] && [ "$RUNNER_ARCH" = "ARM64" ]; then
            echo "cryptography==46.0.3" > "$RUNNER_TEMP/constraints.txt"
            export PIP_CONSTRAINT="$RUNNER_TEMP/constraints.txt"
          fi
          # Without the dev extra: psycopg-binary (the server profile) has no Windows ARM64 wheel, and the desktop
          # does not use PostgreSQL.
          pip install -e . "pytest>=8" "pytest-asyncio>=0.24"
      - name: System
        run: python -c "import platform, sys; print(sys.platform, platform.machine(), platform.platform())"
      - name: Import the workspace (the path that failed on macOS)
        run: python -c "import nodestro_runtime.workspace as w; print('imported', w.__name__)"
      - run: pytest -v --junitxml=junit-platforms.xml tests/test_platform_start.py
      # MUP-ONA A0: the skipped tests of each system as listed in its expectation file (scripts/check_skips.py).
      - name: Skipped tests as expected
        run: python scripts/check_skips.py junit-platforms.xml "tests/ci/skipped-platforms-${{ matrix.os }}.txt"
